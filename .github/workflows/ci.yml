name: ci

on:
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
        shared: [locked, minimum, latest, compatible]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - if: matrix.shared == 'minimum'
        run: npm install --no-save --package-lock=false agentic-design@0.8.0 agentic-identity@0.9.0
      - if: matrix.shared == 'compatible'
        run: npm install --no-save --package-lock=false 'agentic-design@>=0.8.0 <1.0.0' 'agentic-identity@>=0.9.0 <1.0.0'
      - if: matrix.shared == 'latest'
        run: npm install --no-save --package-lock=false agentic-design@latest agentic-identity@latest
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          WRANGLER_SEND_METRICS: "false"
